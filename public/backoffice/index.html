<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order desk | Coca-Cola HBC demo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #F2F1EF; --surface: #FFFFFF; --line: #DEDBD5; --text: #1C1C1C; --muted: #5E5E5E;
    --red: #C8102E; --red-soft: #FBE7EA;
    --amber: #8A5A00; --amber-soft: #FFF2D1;
    --blue: #1D5A8C; --blue-soft: #E3EEF7;
    --green: #2F6B3A; --green-soft: #E4F1E6;
    --fresh: #FFF6D6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #141414; --surface: #1F1F1F; --line: #343434; --text: #EDEDED; --muted: #A3A3A3;
      --red: #FF6B7D; --red-soft: #3A1A1F;
      --amber: #F2C14E; --amber-soft: #3A2E12;
      --blue: #8EC1EA; --blue-soft: #16293A;
      --green: #8FCB98; --green-soft: #1B2F1F;
      --fresh: #3A3416;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 "Barlow", "Segoe UI", Arial, sans-serif; padding-bottom: env(safe-area-inset-bottom, 0px); }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  button { font: inherit; cursor: pointer; }
  .wrap { width: min(1200px, 100% - 2rem); margin-inline: auto; }

  header { background: var(--surface); border-bottom: 1px solid var(--line); border-top: 5px solid var(--red); padding-top: env(safe-area-inset-top, 0px); }
  header .wrap { display: flex; justify-content: space-between; align-items: center; gap: 1rem; min-height: 64px; flex-wrap: wrap; }
  .title { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
  .title h1 { margin: 0; font: 700 1.6rem "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; }
  .title span { color: var(--muted); }
  .live { display: inline-flex; align-items: center; gap: .45rem; color: var(--muted); font-size: .9rem; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
  .live.stale .dot { background: var(--red); }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin: 1.5rem 0; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.2rem; }
  .stat b { display: block; font: 700 2.1rem/1.1 "Barlow Condensed", "Arial Narrow", sans-serif; }
  .stat span { color: var(--muted); }
  @media (max-width: 760px) { .stats { grid-template-columns: 1fr 1fr; } }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: .75rem; }
  .tabs { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .tabs button { border: 0; background: none; color: var(--muted); padding: .4rem .85rem; border-radius: 6px; }
  .tabs button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
  .clear { background: none; border: 1px solid var(--line); color: var(--muted); padding: .45rem .9rem; border-radius: 8px; }
  .clear:hover { border-color: var(--red); color: var(--red); }
  .board-actions { display: flex; gap: .5rem; }

  .list { list-style: none; margin: 0 0 3rem; padding: 0; display: grid; gap: .75rem; }
  .order { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; transition: background-color 1.2s ease; }
  .order.fresh { background: var(--fresh); }
  .order.is-delivered { opacity: .72; }
  .head { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; align-items: baseline; padding: .9rem 1.1rem; border-bottom: 1px solid var(--line); }
  .head .id { font: 700 1.25rem "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .03em; }
  .head .who { font-weight: 600; }
  .head .meta { color: var(--muted); font-size: .9rem; }
  .tag { font-size: .78rem; padding: .1rem .55rem; border-radius: 999px; font-weight: 600; }
  .tag.new { background: var(--red-soft); color: var(--red); }
  .tag.confirmed { background: var(--blue-soft); color: var(--blue); }
  .tag.out_for_delivery { background: var(--amber-soft); color: var(--amber); }
  .tag.delivered { background: var(--green-soft); color: var(--green); }
  .body { display: grid; grid-template-columns: 1fr auto; gap: 1rem 1.5rem; padding: .9rem 1.1rem 1rem; }
  .lines { width: 100%; border-collapse: collapse; font-size: .95rem; }
  .lines td { padding: .3rem .75rem .3rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .lines tr:last-child td { border-bottom: 0; }
  .lines .q { font-weight: 700; white-space: nowrap; width: 3.5rem; }
  .lines .pack { color: var(--muted); }
  .lines .amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .warn { margin: .5rem 0 0; color: var(--red); font-size: .9rem; }
  .note { margin: .5rem 0 0; color: var(--muted); font-size: .9rem; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: .6rem; min-width: 190px; }
  .total { text-align: right; }
  .total b { display: block; font: 700 1.6rem "Barlow Condensed", "Arial Narrow", sans-serif; }
  .total span { color: var(--muted); font-size: .88rem; }
  .actions { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: flex-end; }
  .actions button { border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: .4rem .75rem; border-radius: 6px; }
  .actions button:hover { border-color: var(--red); color: var(--red); }
  @media (max-width: 720px) { .body { grid-template-columns: 1fr; } .side { align-items: stretch; } .total { text-align: left; } .actions { justify-content: flex-start; } }

  .empty { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 8px; padding: 2.5rem 1.5rem; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: .3rem; }
  .error { color: var(--red); margin: 0 0 1rem; }
  @media (prefers-reduced-motion: reduce) { .order { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="title"><h1>Order desk</h1><span>Coca-Cola HBC voice order line</span></div>
    <div class="live" id="live" aria-live="polite"><span class="dot"></span><span id="live-text">Connecting…</span></div>
  </div>
</header>

<main class="wrap">
  <div class="stats">
    <div class="stat"><b id="s-orders">0</b><span>Orders today</span></div>
    <div class="stat"><b id="s-cases">0</b><span>Cases today</span></div>
    <div class="stat"><b id="s-value">€0</b><span>Value today, excl. VAT</span></div>
    <div class="stat"><b id="s-open">0</b><span>Not yet delivered</span></div>
  </div>

  <div class="toolbar">
    <div class="tabs" role="group" aria-label="Filter orders">
      <button type="button" data-f="all" aria-pressed="true">All</button>
      <button type="button" data-f="today" aria-pressed="false">Today</button>
      <button type="button" data-f="new" aria-pressed="false">New</button>
      <button type="button" data-f="confirmed" aria-pressed="false">Confirmed</button>
      <button type="button" data-f="out_for_delivery" aria-pressed="false">Out for delivery</button>
      <button type="button" data-f="delivered" aria-pressed="false">Delivered</button>
    </div>
    <div class="board-actions">
      <button type="button" class="clear" id="reset" title="Remove the orders from demo calls and restore the two-week demo history">Reset demo</button>
      <button type="button" class="clear" id="clear" title="Remove every order, including the demo history">Clear all</button>
    </div>
  </div>

  <p class="error" id="error" hidden></p>
  <ul class="list" id="list"></ul>
</main>

<script>
(function () {
  var STATUS = { new: 'New', confirmed: 'Confirmed', out_for_delivery: 'Out for delivery', delivered: 'Delivered' };
  var NEXT = { new: ['confirmed', 'Confirm'], confirmed: ['out_for_delivery', 'Dispatch'], out_for_delivery: ['delivered', 'Mark delivered'] };
  var filter = 'all', items = [], seen = null, freshUntil = {}, lastOk = 0, token = '';
  try { token = sessionStorage.getItem('cchAdminToken') || ''; } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var eur = new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR' });

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ago(iso) {
    var s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (s < 60) return s + ' s ago';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    var d = new Date(iso);
    var time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === new Date().toDateString()) return 'today ' + time;
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + ', ' + time;
  }
  function day(isoDate) {
    return new Date(isoDate + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
  }
  function headers() { var h = { 'Content-Type': 'application/json' }; if (token) h['X-Admin-Token'] = token; return h; }
  function askToken() {
    var t = prompt('Enter the back office admin token');
    if (!t) return false;
    token = t.trim();
    try { sessionStorage.setItem('cchAdminToken', token); } catch (e) {}
    return true;
  }
  function send(method, url, body) {
    return fetch(url, { method: method, headers: headers(), body: body ? JSON.stringify(body) : undefined }).then(function (r) {
      if (r.status === 401 && askToken()) return send(method, url, body);
      if (!r.ok) throw new Error('The server answered ' + r.status + '.');
      return r.json();
    });
  }

  function render() {
    var today = new Date().toDateString();
    var todays = items.filter(function (o) { return new Date(o.created_at).toDateString() === today; });
    $('s-orders').textContent = todays.length;
    $('s-cases').textContent = todays.reduce(function (n, o) { return n + o.total_cases; }, 0);
    $('s-value').textContent = eur.format(todays.reduce(function (n, o) { return n + o.total_eur; }, 0));
    $('s-open').textContent = items.filter(function (o) { return o.status !== 'delivered'; }).length;

    var shown = items.filter(function (o) {
      if (filter === 'today') return new Date(o.created_at).toDateString() === today;
      return filter === 'all' || o.status === filter;
    });
    var list = $('list');
    if (!shown.length) {
      list.innerHTML = '<li class="empty"><strong>' + (items.length ? 'Nothing in this view' : 'No orders yet') + '</strong>' +
        (items.length ? 'Pick another filter to see the rest.' : 'Use Reset demo to restore the order history, or call the order line. New orders appear here within a few seconds.') + '</li>';
      return;
    }
    list.innerHTML = shown.map(function (o) {
      var fresh = (freshUntil[o.id] || 0) > Date.now();
      var lines = o.items.map(function (i) {
        return '<tr><td class="q">' + i.cases + ' ×</td><td>' + esc(i.name) + ' <span class="pack">' + esc(i.pack) + '</span></td><td class="amt">' + eur.format(i.line_total_eur) + '</td></tr>';
      }).join('');
      var next = NEXT[o.status] ? '<button type="button" data-id="' + o.id + '" data-s="' + NEXT[o.status][0] + '">' + NEXT[o.status][1] + '</button>' : '';
      var back = o.status !== 'new' ? '<button type="button" data-id="' + o.id + '" data-s="new">Back to new</button>' : '';
      return '<li class="order' + (fresh ? ' fresh' : '') + (o.status === 'delivered' ? ' is-delivered' : '') + '">' +
        '<div class="head"><span class="id">' + esc(o.id) + '</span><span class="tag ' + o.status + '">' + STATUS[o.status] + '</span>' +
        '<span class="who">' + esc(o.business_name) + '</span><span class="meta">Account ' + esc(o.account_number) + ', ' + esc(o.area) + '</span>' +
        '<span class="meta">' + ago(o.created_at) + ', via ' + esc(o.source) + '</span></div>' +
        '<div class="body"><div><table class="lines"><tbody>' + lines + '</tbody></table>' +
        (o.unmatched && o.unmatched.length ? '<p class="warn">Not matched to a product: ' + esc(o.unmatched.join('; ')) + '</p>' : '') +
        (o.notes ? '<p class="note">Note: ' + esc(o.notes) + '</p>' : '') + '</div>' +
        '<div class="side"><div class="total"><b>' + eur.format(o.total_eur) + '</b><span>' + o.total_cases + ' cases, delivery ' + day(o.delivery_date) + '</span></div>' +
        '<div class="actions">' + next + back + '</div></div></div></li>';
    }).join('');
  }

  function poll() {
    fetch('/api/orders', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        items = data.orders || [];
        var now = {};
        items.forEach(function (o) { if (seen && !seen[o.id]) freshUntil[o.id] = Date.now() + 6000; now[o.id] = true; });
        seen = now;
        render();
        lastOk = Date.now();
        $('error').hidden = true;
      })
      .catch(function () { $('error').hidden = false; $('error').textContent = 'Can’t reach the order server. Retrying every few seconds.'; });
  }
  function tick() {
    if (!lastOk) return;
    var s = Math.round((Date.now() - lastOk) / 1000);
    $('live').classList.toggle('stale', s > 15);
    $('live-text').textContent = s > 15 ? 'Not updating' : 'Live, refreshes every 3 s';
  }

  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('.tabs button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    render();
  });
  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-id]'); if (!b) return;
    b.disabled = true;
    send('PATCH', '/api/orders/' + encodeURIComponent(b.dataset.id), { status: b.dataset.s }).then(poll)
      .catch(function (err) { alert('Couldn’t update the order. ' + err.message); b.disabled = false; });
  });
  $('reset').addEventListener('click', function () {
    if (!confirm('Restore the two-week demo history? Orders from demo calls will be removed.')) return;
    seen = null;
    send('DELETE', '/api/orders').then(poll).catch(function (err) { alert('Couldn’t reset the board. ' + err.message); });
  });
  $('clear').addEventListener('click', function () {
    if (!confirm('Remove every order, including the demo history?')) return;
    send('DELETE', '/api/orders?mode=empty').then(poll).catch(function (err) { alert('Couldn’t clear the board. ' + err.message); });
  });

  poll();
  setInterval(poll, 3000);
  setInterval(tick, 1000);
  setInterval(render, 30000);
})();
</script>
</body>
</html>
